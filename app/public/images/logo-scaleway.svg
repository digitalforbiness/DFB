<svg xmlns="http://www.w3.org/2000/svg" width="300" height="70" viewBox="0 0 300 70" fill="none">
  <!-- Badge -->
  <rect x="5" y="7" width="54" height="56" rx="17" stroke="#4F0599" stroke-width="7"/>
  <!-- Stylized S mark (two interlocking rounded hooks) -->
  <path d="M37 22 H27 a3 3 0 0 0 -3 3 V35" stroke="#4F0599" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 48 H37 a3 3 0 0 0 3 -3 V35" stroke="#4F0599" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="72" y="41" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-1" fill="#4F0599">Scaleway</text>
  <!-- Tagline -->
  <text x="74" y="61" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5" fill="#4F0599">The cloud of choice</text>
</svg>
